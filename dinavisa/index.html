<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Verificación DINAVISA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#faf5f5;
        }

        .header{
            background:#003366;
            color:white;
            padding:20px;
            border-radius:10px;
            margin-bottom:20px;
        }

        .card{
            border:none;
            box-shadow:0 2px 10px rgba(0,0,0,.10);
        }

        .section-title{
            color:#003366;
            font-weight:bold;
            border-bottom:2px solid #003366;
            padding-bottom:5px;
            margin-bottom:15px;
        }

        .table td{
            vertical-align:middle;
        }

        .table th{
            text-align:center;
        }

        textarea{
            min-height:120px;
        }

        .badge-seccion{
            background:#003366;
            font-size:15px;
            padding:8px 15px;
        }

        .no-conforme-panel{
            display:none;
            margin-top:10px;
            padding:15px;
            background:#fff5f5;
            border-left:4px solid #dc3545;
            border-radius:8px;
        }   


        .no-conforme-panel h6{
            color:#dc3545;
            margin-bottom:10px;
            font-weight:bold;
        }

        .no-conforme-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:15px;
        }

        .no-conforme-panel textarea{
              min-height:80px;
        }

        .no-conforme-panel input,
            .no-conforme-panel textarea{
            width:100%;
        }

        .fila-detalle td{
        background:#f8f9fa;
        padding:15px;
        }

        .detalle-hallazgo{
        border-left:4px solid #dc3545;
        padding-left:15px;
        }

        .detalle-hallazgo label{
        font-weight:600;
        margin-bottom:5px;
        display:block;
        }

        .detalle-hallazgo input{
        margin-bottom:10px;
        }

    </style>

</head>

<body>

<div class="container mt-4 mb-5">

    <!-- ENCABEZADO -->

    <div class="header text-center">

        <h2>LISTA DE VERIFICACIÓN SANITARIA DINAVISA</h2>

        <h4>Versión: 01 Vigencia: 05/11/2026</h4>

        <h6>Lic. Janette Valdovinos</h6>

    </div>

    <form id="inspectionForm">

        <!-- DATOS GENERALES -->

        <div class="card mb-4">

            <div class="card-body">

                <h5 class="section-title">

                    Datos Generales

                </h5>

                <div class="row">

                    <div class="col-md-3 mb-3">

                        <label class="form-label">
                            N° Informe
                        </label>

                        <input
                            type="text"
                            id="informe"
                            class="form-control">

                    </div>

                    <div class="col-md-3 mb-3">

                        <label class="form-label">

                            Fecha

                        </label>

                        <input
                            type="date"
                            id="fecha"
                            class="form-control">

                    </div>

                    <div class="col-md-3 mb-3">

                        <label class="form-label">

                            Hora

                        </label>

                        <input
                            type="time"
                            id="hora"
                            class="form-control">

                    </div>

                    <div class="col-md-3 mb-3">

                        <label class="form-label">

                            Inspector

                        </label>

                        <input
                            type="text"
                            id="inspector"
                            class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Establecimiento

                        </label>

                        <input
                            type="text"
                            id="establecimiento"
                            class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Responsable

                        </label>

                        <input
                            type="text"
                            id="responsable"
                            class="form-control">

                    </div>

                </div>

            </div>

        </div>

        <!-- CHECKLIST -->

        <div class="card mb-4">

            <div class="card-body">

                <h5 class="section-title">

                    Lista de Verificación

                </h5>

                <div id="contenedorChecklist">

                </div>

            </div>

        </div>

        <!-- OBSERVACIONES -->

        <div class="card mb-4">

            <div class="card-body">

                <h5 class="section-title">

                    Observaciones Generales

                </h5>

                <textarea
                    id="observaciones"
                    class="form-control"
                    placeholder="Ingrese observaciones generales..."></textarea>

            </div>

        </div>

        <!-- RESUMEN -->

        <div class="card mb-4">

            <div class="card-body">

                <h5 class="section-title">

                    Resultado de la Inspección

                </h5>

                <div id="resultadoCumplimiento">

                    Pendiente de evaluar.

                </div>

            </div>

        </div>

        <!-- BOTONES -->

        <div class="text-center">

            <button
                type="submit"
                class="btn btn-primary btn-lg me-2">

                Calcular Resultado

            </button>

            <button
                type="button"
                id="btnPDF"
                class="btn btn-success btn-lg me-2">

                Generar PDF

            </button>

            <button
                type="reset"
                class="btn btn-secondary btn-lg">

                Limpiar

            </button>

        </div>

    </form>

</div>

<!-- jsPDF -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


<canvas
    id="graficoPDF"
    width="1200"
    height="1200"
    style="display:none;">
</canvas>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Tu aplicación -->
<script src="js/DinavisaAPP.js"></script>


</body>

</html>
