<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Verificación DINAVISA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#faf5f5;
        }

        .header{
            background:#003366;
            color:white;
            padding:20px;
            border-radius:10px;
            margin-bottom:20px;
        }

        .card{
            border:none;
            box-shadow:0 2px 10px rgba(0,0,0,.10);
        }

        .section-title{
            color:#003366;
            font-weight:bold;
            border-bottom:2px solid #003366;
            padding-bottom:5px;
            margin-bottom:15px;
        }

        .table td{
            vertical-align:middle;
        }

        .table th{
            text-align:center;
        }

        textarea{
            min-height:120px;
        }

        .badge-seccion{
            background:#003366;
            font-size:15px;
            padding:8px 15px;
        }

    </style>

</head>

<body>

<div class="container mt-4 mb-5">

    <!-- ENCABEZADO -->

    <div class="header text-center">

        <h2>LISTA DE VERIFICACIÓN SANITARIA INAN</h2>

        <h4>Versión: 01 Vigencia: 02/08/2021</h4>

        <h6>Lic. Janette Valdovinos</h6>

    </div>

    <form id="inspectionForm">

        <!-- DATOS GENERALES -->

        <div class="card mb-4">

            <div class="card-body">

                <h5 class="section-title">

                    Datos Generales

                </h5>

                <div class="row">

                    <div class="col-md-3 mb-3">

                        <label class="form-label">
                            N° Informe
                        </label>

                        <input
                            type="text"
                            id="informe"
                            class="form-control">

                    </div>

                    <div class="col-md-3 mb-3">

                        <label class="form-label">

                            Fecha

                        </label>

                        <input
                            type="date"
                            id="fecha"
                            class="form-control">

                    </div>

                    <div class="col-md-3 mb-3">

                        <label class="form-label">

                            Hora

                        </label>

                        <input
                            type="time"
                            id="hora"
                            class="form-control">

                    </div>

                    <div class="col-md-3 mb-3">

                        <label class="form-label">

                            Inspector

                        </label>

                        <input
                            type="text"
                            id="inspector"
                            class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Establecimiento

                        </label>

                        <input
                            type="text"
                            id="establecimiento"
                            class="form-control">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Responsable

                        </label>

                        <input
                            type="text"
                            id="responsable"
                            class="form-control">

                    </div>

                </div>

            </div>

        </div>

        <!-- CHECKLIST -->

        <div class="card mb-4">

            <div class="card-body">

                <h5 class="section-title">

                    Lista de Verificación

                </h5>

                <div id="contenedorChecklist">

                </div>

            </div>

        </div>

        <!-- OBSERVACIONES -->

        <div class="card mb-4">

            <div class="card-body">

                <h5 class="section-title">

                    Observaciones Generales

                </h5>

                <textarea
                    id="observaciones"
                    class="form-control"
                    placeholder="Ingrese observaciones generales..."></textarea>

            </div>

        </div>

        <!-- RESUMEN -->

        <div class="card mb-4">

            <div class="card-body">

                <h5 class="section-title">

                    Resultado de la Inspección

                </h5>

                <div id="resultadoCumplimiento">

                    Pendiente de evaluar.

                </div>

            </div>

        </div>

        <!-- BOTONES -->

        <div class="text-center">

            <button
                type="submit"
                class="btn btn-primary btn-lg me-2">

                Calcular Resultado

            </button>

            <button
                type="button"
                id="btnPDF"
                class="btn btn-success btn-lg me-2">

                Generar PDF

            </button>

            <button
                type="reset"
                class="btn btn-secondary btn-lg">

                Limpiar

            </button>

        </div>

    </form>

</div>

<!-- jsPDF -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- App -->

<script src="js/InanAPP.js"></script>

</body>

</html>
