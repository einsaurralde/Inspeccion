<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Histórico de Inspecciones</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{
    font-family: Arial, sans-serif;
    margin:20px;
    background:#f5f5f5;
}

h1{
    text-align:center;
}

.filtros{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

input,
select,
button{
    padding:10px;
}

button{
    background:#007bff;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th{
    background:#343a40;
    color:white;
}

th,td{
    padding:10px;
    border:1px solid #ddd;
}

#detalleHallazgos{
    margin-top:20px;
}

.card{
    background:white;
    padding:15px;
    border-radius:8px;
    margin-top:20px;
}

.grafico-card{
    width: 700px;
    height: 320px;
    margin: 20px auto;
    background:white;
    border-radius:10px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.10);
}

</style>

</head>

<body>

<h1>Histórico de Inspecciones</h1>

<div class="filtros">

    <input type="date" id="fechaDesde">

    <input type="date" id="fechaHasta">

    <input
        type="text"
        id="establecimiento"
        placeholder="Establecimiento">

    <button onclick="consultarInspecciones()">
        Buscar
    </button>

    <button onclick="exportarExcel()">
        Exportar Excel
    </button>

</div>

<div class="grafico-card">

    <canvas id="graficoCumplimiento"></canvas>

</div>

<br>

<div id="resultadoInspecciones"></div>

<div id="detalleHallazgos"></div>

<script src="historicos.js"></script>

</body>
</html>
